name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_workspace.js
      - run: node tests/test_image_tools.js
      - run: node tests/test_ux.js
      - run: node tests/test_settings.js
      - run: node tests/test_drop.js
      - run: node --check assets/workspace.js && node --check assets/settings.js && node --check assets/image-tools.js && node --check assets/image-tools-core.js
